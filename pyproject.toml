[project]
name = "idrkd"
version = "0.1.0"
description = "Intelligent Data Reconciliation and Knowledge Discovery system."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "neo4j>=5.20",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "redis>=5.0",
  "celery>=5.4",
  "kafka-python>=2.0",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "tree-sitter>=0.22",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "a2a-sdk[http-server]>=1.1",
  "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-protobuf>=5.29",
]

[project.optional-dependencies]
ml = [
  "torch==2.8.0",
  "transformers>=4.43",
  "sentence-transformers>=3.0",
  "datasets>=2.20",
  "peft>=0.11",
  "trl>=0.9",
  "accelerate>=0.32",
  "bitsandbytes",
  "sentencepiece>=0.2.2",
]

[project.scripts]
idrkd-distill = "idrkd.distillation.cli:main"
idrkd-quantize = "idrkd.distillation.quantize_cli:main"
idrkd-quantize-awq = "idrkd.distillation.quantize_cli:main"
idrkd-drift-worker = "idrkd.drift.cli:main"
idrkd-graphify = "idrkd.graph.graphify_importer:main"
idrkd-mcp-smoke = "idrkd.mcp.live_smoke:main"
idrkd-release = "idrkd.evaluation.release_cli:main"
idrkd-ingest-corpus = "idrkd.ingestion.corpus_cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["idrkd"]
