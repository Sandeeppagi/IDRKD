global:
  scrape_interval: 15s

scrape_configs:
  - job_name: mcp-server
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp-server:8080"]

  - job_name: reindex-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["reindex-worker:9101"]

  - job_name: drift-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["drift-worker:9102"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
