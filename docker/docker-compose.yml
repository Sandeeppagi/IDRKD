services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/change-me
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: idrkd
      POSTGRES_PASSWORD: idrkd
      POSTGRES_DB: idrkd
    volumes:
      - ../configs/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idrkd -d idrkd"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: idrkd
      MINIO_ROOT_PASSWORD: change-me-now
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.0.1
    ports:
      - "9090:9090"
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ../configs/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro

  mcp-server:
    build:
      context: ..
      dockerfile: docker/idrkd.Dockerfile
    ports:
      - "8080:8080"
    environment:
      TENANT_ID: ${TENANT_ID:-tenant-live}
      REPO_ID: ${REPO_ID:-week5-e2e}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change-me
      POSTGRES_DSN: postgresql://idrkd:idrkd@postgres:5432/idrkd
      REDIS_URL: redis://redis:6379/0
      IDRKD_STUDENT_MODEL_BASE_URL: ${IDRKD_STUDENT_MODEL_BASE_URL:-http://slm-server:8000/v1}
      IDRKD_STUDENT_MODEL_ID: ${IDRKD_STUDENT_MODEL_ID:-idrkd-student-awq}
      IDRKD_STUDENT_MODEL_API_KEY: ${IDRKD_STUDENT_MODEL_API_KEY:-idrkd-local}
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  autogen-reconciler:
    build:
      context: ..
      dockerfile: docker/idrkd.Dockerfile
    command:
      - idrkd-autogen-reconciler
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --public-endpoint
      - http://autogen-reconciler:8090/
    ports:
      - "8090:8090"
    environment:
      TENANT_ID: ${TENANT_ID:-tenant-live}
      REPO_ID: ${REPO_ID:-week5-e2e}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change-me
      POSTGRES_DSN: postgresql://idrkd:idrkd@postgres:5432/idrkd
      REDIS_URL: redis://redis:6379/0
      IDRKD_A2A_SHARED_SECRET: ${IDRKD_A2A_SHARED_SECRET:-local-development}
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/.well-known/agent-card.json', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  reindex-worker:
    build:
      context: ..
      dockerfile: docker/idrkd.Dockerfile
    command: ["idrkd-drift-worker", "reindex-loop"]
    environment:
      TENANT_ID: ${TENANT_ID:-tenant-live}
      REPO_ID: ${REPO_ID:-week5-e2e}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change-me
      POSTGRES_DSN: postgresql://idrkd:idrkd@postgres:5432/idrkd
      REDIS_URL: redis://redis:6379/0
      REINDEX_QUEUE_KIND: mcp
      REINDEX_QUEUE_KEY: idrkd:mcp:reindex
      WORKER_METRICS_PORT: 9101
      LOG_LEVEL: INFO
    ports:
      - "9101:9101"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "idrkd-drift-worker", "healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 6

  drift-worker:
    build:
      context: ..
      dockerfile: docker/idrkd.Dockerfile
    profiles: ["drift"]
    command: ["idrkd-drift-worker", "reindex-loop"]
    environment:
      TENANT_ID: ${TENANT_ID:-tenant-live}
      REPO_ID: ${REPO_ID:-week5-e2e}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change-me
      POSTGRES_DSN: postgresql://idrkd:idrkd@postgres:5432/idrkd
      REDIS_URL: redis://redis:6379/0
      REINDEX_QUEUE_KIND: drift
      REINDEX_QUEUE_KEY: idrkd:reindex
      WORKER_METRICS_PORT: 9102
      LOG_LEVEL: INFO
    ports:
      - "9102:9102"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "idrkd-drift-worker", "healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 6

  slm-server:
    build:
      context: ..
      dockerfile: docker/vllm-secure.Dockerfile
      args:
        VLLM_IMAGE: ${IDRKD_VLLM_IMAGE:-vllm/vllm-openai:v0.27.1@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967}
        COSIGN_IMAGE: ${IDRKD_COSIGN_IMAGE:-ghcr.io/sigstore/cosign/cosign:v3.0.6@sha256:de9c65609e6bde17e6b48de485ee788407c9502fa08b8f4459f595b21f56cd00}
    image: idrkd/vllm-secure:0.27.1
    profiles: ["slm-server"]
    ports:
      - "127.0.0.1:${IDRKD_SLM_PORT:-8000}:8000"
    volumes:
      - ${IDRKD_SLM_MODEL_ROOT:-../artifacts/models}:/models:ro
      - ${IDRKD_RELEASE_EVIDENCE_ROOT:-../eval/releases/phi4-mini-llmc-awq-v1}:/release:ro
      - ${IDRKD_COSIGN_PUBLIC_KEY_PATH:-/workspace/idrkd-trust/cosign.pub}:/keys/cosign.pub:ro
      - ${IDRKD_VLLM_API_KEY_PATH:-/workspace/idrkd-secrets/vllm-api-key}:/run/secrets/vllm_api_key:ro
    environment:
      IDRKD_VLLM_API_KEY_FILE: /run/secrets/vllm_api_key
      HF_HOME: /tmp/huggingface
      VLLM_CACHE_ROOT: /tmp/vllm
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      DO_NOT_TRACK: "1"
      HOME: /tmp
    command:
      - --checkpoint
      - ${IDRKD_SLM_MODEL_PATH:-/models/checkpoints/phi4-mini-dpo-tooljson-split-v2-llmc-awq}
      - --promotion-record
      - /release/promotion-record.json
      - --descriptor
      - /release/model-release.json
      - --bundle
      - /release/model-release.sigstore.json
      - --public-key
      - /keys/cosign.pub
      - --served-model-name
      - ${IDRKD_STUDENT_MODEL_ID:-idrkd-phi4-mini-dpo-tooljson-split-v2-llmc-awq}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${IDRKD_SLM_MAX_MODEL_LEN:-4096}
      - --gpu-memory-utilization
      - ${IDRKD_SLM_GPU_MEMORY_UTILIZATION:-0.9}
    user: "2000:0"
    read_only: true
    tmpfs:
      - /tmp:size=8g,exec,mode=1777
    shm_size: 8gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import os,urllib.request;
          k=open(os.environ['IDRKD_VLLM_API_KEY_FILE']).read().strip();
          r=urllib.request.Request('http://127.0.0.1:8000/v1/models',
          headers={'Authorization':'Bearer '+k});
          urllib.request.urlopen(r,timeout=5).read()"
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  slm-server-laptop:
    image: ollama/ollama:latest
    profiles: ["slm-server-laptop"]
    ports:
      - "${IDRKD_SLM_LAPTOP_PORT:-11434}:11434"
    volumes:
      - ../models/ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434

  graphify:
    build:
      context: ..
      dockerfile: docker/graphify.Dockerfile
    profiles: ["graphify"]
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ../data/raw:/work/raw:ro
      - ../data/processed/graphify-out:/work/graphify-out
    environment:
      TENANT_ID: ${TENANT_ID:-tenant-live}
      REPO_ID: ${REPO_ID:-telstra-messaging-api-sdk-python}
      SOURCE_LABEL: ${GRAPHIFY_OUTPUT_NAME:-telstra-messaging-api-sdk-python}
      GRAPHIFY_SOURCE_DIR: ${GRAPHIFY_SOURCE_DIR:-telstra-messaging-api-sdk-python}
      GRAPHIFY_OUTPUT_NAME: ${GRAPHIFY_OUTPUT_NAME:-telstra-messaging-api-sdk-python}
      GRAPHIFY_GIT_URL: ${GRAPHIFY_GIT_URL:-https://github.com/telstra/MessagingAPI-SDK-python.git}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change-me
    command:
      - /bin/sh
      - -lc
      - repo="$${GRAPHIFY_SOURCE_DIR:-telstra-messaging-api-sdk-python}" && out="$${GRAPHIFY_OUTPUT_NAME:-$$repo}" && source_label="$${SOURCE_LABEL:-$$out}" && rm -rf "/tmp/$$repo" "/work/graphify-out/$$out" && if [ -d "/work/raw/$$repo" ]; then cp -R "/work/raw/$$repo" "/tmp/$$repo"; else git clone --depth 1 "$${GRAPHIFY_GIT_URL:-https://github.com/telstra/MessagingAPI-SDK-python.git}" "/tmp/$$repo"; fi && graphify update "/tmp/$$repo" --force --no-cluster && python -m idrkd.graph.graphify_importer import --graph "/tmp/$$repo/graphify-out/graph.json" --neo4j-uri "$$NEO4J_URI" --neo4j-user "$$NEO4J_USER" --neo4j-password "$$NEO4J_PASSWORD" --tenant-id "$${TENANT_ID:-tenant-live}" --repo-id "$${REPO_ID:-$$out}" --source-label "$$source_label" && python -m idrkd.graph.graphify_importer smoke --graph "/tmp/$$repo/graphify-out/graph.json" --neo4j-uri "$$NEO4J_URI" --neo4j-user "$$NEO4J_USER" --neo4j-password "$$NEO4J_PASSWORD" --tenant-id "$${TENANT_ID:-tenant-live}" --repo-id "$${REPO_ID:-$$out}" --source-label "$$source_label" && mkdir -p /work/graphify-out && cp -R "/tmp/$$repo/graphify-out" "/work/graphify-out/$$out"
